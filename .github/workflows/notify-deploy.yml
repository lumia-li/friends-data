name: notify-deploy

# 友链数据仓库里 data/friends/ 一有变动（审核通过把文件移进来、或删除友链），
# 就让博客那边重新构建一次——友链页是构建时生成的，不重建就看不到新友链。
#
# 使用前在仓库里加一个密钥（只需一次）：
#   Settings → Secrets and variables → Actions → New repository secret
#   名称：VERCEL_DEPLOY_HOOK
#   值  ：Vercel 项目的 Deploy Hook 地址（本地 .env 里的 VERCEL_DEPLOY_HOOK_URL）
#
# 没配也安全：会输出一条 warning 后正常跳过，不影响仓库其它操作。

on:
  push:
    branches:
      - main
    paths:
      - "data/friends/**"

# 连续改动多次时只跑最后一次，避免排队触发好几轮构建
concurrency:
  group: notify-deploy
  cancel-in-progress: true

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 触发 Vercel 重新部署
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::未配置 VERCEL_DEPLOY_HOOK 密钥，跳过本次部署触发"
            exit 0
          fi
          status=$(curl -sS -o /tmp/hook-body -w "%{http_code}" -X POST "$HOOK") || {
            echo "::error::请求 Deploy Hook 失败（网络错误）"
            exit 1
          }
          echo "Deploy Hook 返回 HTTP $status"
          cat /tmp/hook-body || true
          echo
          if [ "$status" -ge 400 ]; then
            echo "::error::触发部署失败（HTTP $status），检查一下 Deploy Hook 是否还有效"
            exit 1
          fi
          echo "已触发重新构建，稍等一两分钟友链页就会更新。"
