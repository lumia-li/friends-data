name: notify-application

# 有人申请友链时通知站长：
#   data/applications/ 里**新增**文件 → 自动开一个 Issue 并指派给仓库主人，
#   GitHub 会把「指派给你的 Issue」用邮件 + 手机 App 推给你。
#
# 不需要任何密钥（用仓库自带的 GITHUB_TOKEN，只要给它 issues: write 权限）。
# 申请文件被「修改」（比如信息更新重复提交）不会重复开 Issue，避免刷屏。
#
# 怎么关闭：删掉这个文件，或者把仓库的 Issues 功能关掉。

on:
  push:
    branches:
      - main
    paths:
      - "data/applications/**"

permissions:
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 找出本次新增的申请文件
        id: added
        uses: actions/github-script@v7
        with:
          script: |
            const files = new Set();
            for (const commit of context.payload.commits || []) {
              for (const file of commit.added || []) {
                if (file.startsWith('data/applications/') && file.endsWith('.json')) files.add(file);
              }
            }
            core.setOutput('files', JSON.stringify([...files]));

      - name: 为每条新申请开一个 Issue 并指派给站长
        if: steps.added.outputs.files != '[]'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const files = JSON.parse('${{ steps.added.outputs.files }}').filter(Boolean);
            if (files.length === 0) return;

            const status = (ok) => (ok === true ? '✅ 正常' : ok === false ? '❌ 有问题' : '— 没检测');

            for (const path of files) {
              let entry = {};
              try {
                const res = await github.rest.repos.getContent({ owner, repo, path });
                entry = JSON.parse(Buffer.from(res.data.content, 'base64').toString('utf8'));
              } catch (error) {
                core.warning(`读取 ${path} 失败：${error.message}`);
              }

              const checks = entry.checks || {};
              const body = [
                '有人在友链页提交了申请，下面是提交时的信息与自动检测结果。',
                '',
                '| 项目 | 内容 |',
                '| --- | --- |',
                `| 站点名 | ${entry.name || '（未填）'} |`,
                `| 地址 | ${entry.url || '（未填）'} |`,
                `| 简介 | ${entry.description || '（未填）'} |`,
                `| 头像 | ${entry.avatar || '（未填）'} |`,
                `| 友链页 | ${entry.backlink || '（没填，回链需要你手动核对）'} |`,
                `| 提交时间 | ${entry.submittedAt || '（未记录）'} |`,
                '',
                '**提交时的自动检测**',
                '',
                `- 站点可达：${status(checks.siteReachable)}${checks.siteStatus ? `（HTTP ${checks.siteStatus}）` : ''}`,
                `- 头像可达：${status(checks.avatarReachable)}${checks.avatarStatus ? `（HTTP ${checks.avatarStatus}）` : ''}`,
                `- 双向链接：${status(checks.backlinkVerified)}`,
                ...(checks.siteNote ? ['', `> 站点检测备注：${checks.siteNote}`] : []),
                ...(checks.avatarNote ? [`> 头像检测备注：${checks.avatarNote}`] : []),
                '',
                '**怎么处理**',
                '',
                `1. 打开申请文件 [\`${path}\`](../blob/main/${path})`,
                '2. 把 `"status": "pending"` 改成 `"approved"`（不通过就改成 `"rejected"`）',
                '3. 提交后工作流会自动触发博客重新部署，一两分钟后友链就会出现在页面上',
                '',
                '处理完把这个 Issue 关掉就行。',
              ].join('\n');

              await github.rest.issues.create({
                owner,
                repo,
                title: `新友链申请：${entry.name || path}`,
                body,
                assignees: [owner],
              });
            }
